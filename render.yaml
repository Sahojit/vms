databases:
  - name: vms-postgres
    databaseName: vms
    user: vms
    plan: free

services:
  - type: keyvalue
    name: vms-redis
    plan: free
    ipAllowList: []

  # Render's free plan doesn't offer a Background Worker service type, so there is no separate
  # vms-worker here — vms-api runs the BullMQ consumer in-process instead (RUN_WORKER_INLINE,
  # default true; see src/server.ts and docs/decisions.md). Add a real `type: worker` service
  # back (same Dockerfile, dockerCommand: node dist/worker.js) if this ever moves to a paid plan.
  - type: web
    name: vms-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vms-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vms-redis
          type: keyvalue
          property: connectionString
      - key: WEB_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: MAX_PREAPPROVALS_PER_HOST_PER_DAY
        value: '5'
      - key: OVERSTAY_MINUTES
        value: '480'
      - key: PENDING_APPROVAL_TIMEOUT_MINUTES
        value: '30'
      - key: PUBLIC_RATE_LIMIT_WINDOW_MS
        value: '60000'
      - key: PUBLIC_RATE_LIMIT_MAX
        value: '30'
      - key: MAIL_FROM
        value: vms@example.com
      # No hosted email/object storage wired up yet — email send and photo upload fail soft
      # (see docs/decisions.md); SMTP_HOST/MINIO_* intentionally left at their local defaults.
